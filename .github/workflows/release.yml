name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable annotated v* tag to release or safely resume
        required: true
        type: string

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  PROMOTION_JAVA_VERSION: '21.0.12+8.0.LTS'
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

concurrency:
  group: release-maven-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify immutable annotated release identity
        run: |
          version="$(sed -n 's/^addon_version=//p' gradle.properties)"
          test -n "${version}"
          [[ "${version}" != *-SNAPSHOT ]]
          [[ "${RELEASE_TAG}" =~ ^v[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]
          test "${RELEASE_TAG}" = "v${version}"
          git fetch --force --tags origin
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          test "$(git rev-parse 'HEAD^{commit}')" = \
            "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Check out exact BlueMap backport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jan-guenter/BlueMap
          ref: 9be321df995a1103808621d529eb72773e719d4d
          path: .ci/bluemap
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact detached BlueMap identities
        run: |
          test "$(git -C .ci/bluemap rev-parse --abbrev-ref HEAD)" = "HEAD"
          test "$(git -C .ci/bluemap rev-parse HEAD)" = \
            "9be321df995a1103808621d529eb72773e719d4d"
          test "$(git -C .ci/bluemap/api rev-parse HEAD)" = \
            "285c9a60eff3ac2b0cab308ce1058d1565be0971"
          git -C .ci/bluemap fetch --force --tags origin
          test "$(git -C .ci/bluemap describe --exact-match --tags HEAD)" = \
            "v5.22-agent.backport-5.22-mc1.21.1-2"

      - name: Set up exact promotion Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.PROMOTION_JAVA_VERSION }}

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Verify exact BlueMap add-on toolkit
        run: |
          python -m pip install --disable-pip-version-check \
            --no-deps --require-hashes --only-binary=:all: \
            --requirement requirements/toolkit.txt
          toolkit_version="$(sed -n \
            's#^bluemap-addon-toolkit @ .*/releases/download/v\([^/]*\)/.*#\1#p' \
            requirements/toolkit.txt)"
          [[ "${toolkit_version}" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]
          test "$(bluemap-addon-toolkit --version)" = "${toolkit_version}"
          bluemap-addon-toolkit conventions check .

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.1'
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Acquire exact ephemeral Functional Storage inputs
        run: |
          input_dir="${RUNNER_TEMP}/functional-storage-input"
          mkdir -p "${input_dir}"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/functionalstorage-1.21.1-1.5.8.jar" \
            "https://www.curseforge.com/api/v1/mods/556861/files/8459097/download"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/titanium-1.21-4.0.45.jar" \
            "https://www.curseforge.com/api/v1/mods/287342/files/8426819/download"
          test "$(stat -c %s \
            "${input_dir}/functionalstorage-1.21.1-1.5.8.jar")" -eq 810628
          test "$(stat -c %s \
            "${input_dir}/titanium-1.21-4.0.45.jar")" -eq 606801
          sha256sum --check <<SHA256SUMS
          e3e7368c28a24e7de5b877988aa92cc94ca7417c8f60b7d28e7f584a94a51147  ${input_dir}/functionalstorage-1.21.1-1.5.8.jar
          d224a9bd5cfb9e921ba644b2a7a2ce1041f879a9945f80dacebd87d95888530c  ${input_dir}/titanium-1.21-4.0.45.jar
          SHA256SUMS
          python3 tools/verify_pinned_artifacts.py \
            --functional-storage-jar \
              "${input_dir}/functionalstorage-1.21.1-1.5.8.jar" \
            --titanium-jar "${input_dir}/titanium-1.21-4.0.45.jar"

      - name: Verify gallery and provenance inputs
        run: |
          python3 -m json.tool provenance/upstreams.json >/dev/null
          python3 -m json.tool provenance/release.json >/dev/null
          python3 gallery/generate.py --check
          python3 gallery/lint.py
          (cd gallery && sha256sum --check SHA256SUMS)
          bash gallery/package.sh "${RUNNER_TEMP}/gallery-first.zip"
          bash gallery/package.sh "${RUNNER_TEMP}/gallery-second.zip"
          cmp "${RUNNER_TEMP}/gallery-first.zip" \
            "${RUNNER_TEMP}/gallery-second.zip"
          test "$(stat -c %s "${RUNNER_TEMP}/gallery-first.zip")" -eq 4697
          sha256sum --check <<SHA256SUMS
          51dd3845398b9c624631e227468bcce65e693dce15e2f764c67dfe8ba9fddd27  ${RUNNER_TEMP}/gallery-first.zip
          SHA256SUMS

      - name: Build and verify accepted bytes
        run: |
          input_dir="${RUNNER_TEMP}/functional-storage-input"
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            -PfunctionalStorageJar="${input_dir}/functionalstorage-1.21.1-1.5.8.jar" \
            -PtitaniumJar="${input_dir}/titanium-1.21-4.0.45.jar" \
            "-PreleaseTag=${RELEASE_TAG}" \
            clean check build generatePomFileForAddonPublication \
            generateMetadataFileForAddonPublication \
            verifyPublicationArtifacts verifyReleaseCandidate
          test "$(stat -c %s \
            "build/libs/bluemap-functional-storage-addon-${VERSION}.jar")" \
            -eq 82274
          test "$(stat -c %s \
            "build/libs/bluemap-functional-storage-addon-${VERSION}-sources.jar")" \
            -eq 39515
          test "$(stat -c %s build/publications/addon/pom-default.xml)" -eq 1397
          test "$(stat -c %s build/publications/addon/module.json)" -eq 2894
          sha256sum --check <<SHA256SUMS
          ffe80812802c2c8f68d50ee74f17dd492561f3b44a9e650545064f66e285b048  build/libs/bluemap-functional-storage-addon-${VERSION}.jar
          5b5b91d6d17f658a8de6dc99920e39bbe0e54518d5f2b9093760c9e17b13d9ef  build/libs/bluemap-functional-storage-addon-${VERSION}-sources.jar
          1d037275fa62154cf962e408497235e43d96e039a2eb39b6e142638320a04d0a  build/publications/addon/pom-default.xml
          2ba7a4cc10ebcc230cf2128bbf086817985d94e7efa0a6e2945866e043ea330f  build/publications/addon/module.json
          SHA256SUMS
          python3 tools/verify_staged_equivalence.py \
            --jar "build/libs/bluemap-functional-storage-addon-${VERSION}.jar" \
            --entries provenance/accepted-staging-entries.sha256

      - name: Prepare deterministic release bundle
        run: |
          mkdir release
          cp "build/libs/bluemap-functional-storage-addon-${VERSION}.jar" release/
          cp "build/libs/bluemap-functional-storage-addon-${VERSION}-sources.jar" \
            release/
          cp build/publications/addon/pom-default.xml \
            "release/bluemap-functional-storage-addon-${VERSION}.pom"
          cp build/publications/addon/module.json \
            "release/bluemap-functional-storage-addon-${VERSION}.module.json"
          (
            cd release
            sha256sum -- \
              "./bluemap-functional-storage-addon-${VERSION}-sources.jar" \
              "./bluemap-functional-storage-addon-${VERSION}.jar" \
              "./bluemap-functional-storage-addon-${VERSION}.module.json" \
              "./bluemap-functional-storage-addon-${VERSION}.pom" \
              > SHA256SUMS
          )
          (cd release && sha256sum --check SHA256SUMS)
          test "$(stat -c %s release/SHA256SUMS)" -eq 492
          test "$(sha256sum release/SHA256SUMS | cut -d ' ' -f 1)" = \
            7347224cc6b08775e3eed26124edd46514d5ce485b1c7a2459f24122ef73ffff

      - name: Create or refresh draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            test "$(gh release view "${RELEASE_TAG}" \
              --json isDraft --jq '.isDraft')" = true
            gh release upload "${RELEASE_TAG}" release/* --clobber
          else
            gh release create "${RELEASE_TAG}" release/* \
              --draft \
              --prerelease \
              --generate-notes \
              --title "BlueMap Functional Storage Add-on ${VERSION}" \
              --verify-tag
          fi

      - name: Attest release assets with Sigstore
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/*

      - name: Publish Maven package
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            -PfunctionalStorageJar="${RUNNER_TEMP}/functional-storage-input/functionalstorage-1.21.1-1.5.8.jar" \
            -PtitaniumJar="${RUNNER_TEMP}/functional-storage-input/titanium-1.21-4.0.45.jar" \
            publishAddonPublicationToGitHubPackagesRepository

      - name: Verify draft assets and publish public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          downloaded="${RUNNER_TEMP}/release-assets"
          mkdir -p "${downloaded}"
          gh release download "${RELEASE_TAG}" --dir "${downloaded}"
          for asset in release/*; do
            cmp "${asset}" "${downloaded}/$(basename "${asset}")"
          done
          gh release edit "${RELEASE_TAG}" --draft=false --prerelease
